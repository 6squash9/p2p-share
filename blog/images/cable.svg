<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1000" height="520" fill="#ffffff"/><text x="40" y="52" font-size="26" font-weight="700" fill="#16202c">What&#8217;s inside a cable on the sea floor</text><text x="40" y="80" font-size="16" fill="#5d6b7a">Roughly garden-hose thick &#8212; and almost all of it is armour (simplified)</text><circle cx="300" cy="290" r="160" fill="#2b3a4a" stroke="#ffffff" stroke-width="2"/><circle cx="300" cy="290" r="134" fill="#7d8b99" stroke="#ffffff" stroke-width="2"/><circle cx="300" cy="290" r="110" fill="#aab6c2" stroke="#ffffff" stroke-width="2"/><circle cx="300" cy="290" r="86" fill="#c98f2e" stroke="#ffffff" stroke-width="2"/><circle cx="300" cy="290" r="62" fill="#e8dcc0" stroke="#ffffff" stroke-width="2"/><circle cx="300" cy="290" r="26" fill="#eef7ff" stroke="#ffffff" stroke-width="2"/><circle cx="291" cy="281" r="4" fill="#d9480f"/><circle cx="309" cy="281" r="4" fill="#d9480f"/><circle cx="291" cy="299" r="4" fill="#d9480f"/><circle cx="309" cy="299" r="4" fill="#d9480f"/><circle cx="300" cy="290" r="4" fill="#d9480f"/><rect x="560" y="136" width="18" height="18" rx="4" fill="#2b3a4a" stroke="#c8d4e0"/><text x="590" y="150" font-size="16" fill="#16202c">polyethylene &#8212; the outer skin</text><rect x="560" y="178" width="18" height="18" rx="4" fill="#7d8b99" stroke="#c8d4e0"/><text x="590" y="192" font-size="16" fill="#16202c">steel wire armour</text><rect x="560" y="220" width="18" height="18" rx="4" fill="#aab6c2" stroke="#c8d4e0"/><text x="590" y="234" font-size="16" fill="#16202c">aluminium water barrier</text><rect x="560" y="262" width="18" height="18" rx="4" fill="#c98f2e" stroke="#c8d4e0"/><text x="590" y="276" font-size="16" fill="#16202c">copper tube &#8212; carries power to the repeaters</text><rect x="560" y="304" width="18" height="18" rx="4" fill="#e8dcc0" stroke="#c8d4e0"/><text x="590" y="318" font-size="16" fill="#16202c">petroleum jelly &#8212; keeps water out</text><rect x="560" y="346" width="18" height="18" rx="4" fill="#d9480f"/><text x="590" y="360" font-size="16" font-weight="700" fill="#16202c">the optical fibres</text><text x="590" y="384" font-size="15" fill="#5d6b7a">thinner than a human hair &#8212; this is the part</text><text x="590" y="406" font-size="15" fill="#5d6b7a">that actually carries your file</text><line x1="314" y1="276" x2="548" y2="354" stroke="#d9480f" stroke-width="1.8"/></svg>