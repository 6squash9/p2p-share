<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1000" height="500" fill="#ffffff"/><text x="40" y="52" font-size="26" font-weight="700" fill="#16202c">Nobody has the map</text><text x="40" y="80" font-size="16" fill="#5d6b7a">Each router knows only its neighbours &#8212; so packets from one file take different roads</text><line x1="72" y1="250" x2="210" y2="250" stroke="#c8d4e0" stroke-width="2"/><line x1="210" y1="250" x2="360" y2="145" stroke="#c8d4e0" stroke-width="2"/><line x1="360" y1="145" x2="530" y2="145" stroke="#c8d4e0" stroke-width="2"/><line x1="530" y1="145" x2="810" y2="250" stroke="#c8d4e0" stroke-width="2"/><line x1="210" y1="250" x2="340" y2="360" stroke="#c8d4e0" stroke-width="2"/><line x1="340" y1="360" x2="500" y2="360" stroke="#c8d4e0" stroke-width="2"/><line x1="500" y1="360" x2="660" y2="360" stroke="#c8d4e0" stroke-width="2"/><line x1="660" y1="360" x2="810" y2="250" stroke="#c8d4e0" stroke-width="2"/><line x1="810" y1="250" x2="942" y2="250" stroke="#c8d4e0" stroke-width="2"/><line x1="360" y1="145" x2="500" y2="360" stroke="#c8d4e0" stroke-width="2"/><polyline points="72,250 210,250 340,360 500,360 660,360 810,250 942,250" fill="none" stroke="#1a7f5a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><polyline points="72,250 210,250 360,145 530,145 810,250 942,250" fill="none" stroke="#1f6feb" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7"/><rect x="20" y="226" width="104" height="48" rx="10" fill="#16202c"/><text x="72" y="256" font-size="15" fill="#fff" text-anchor="middle">you</text><circle cx="210" cy="250" r="25" fill="#fff" stroke="#16202c" stroke-width="2"/><text x="210" y="256" font-size="15" font-weight="600" fill="#16202c" text-anchor="middle">R1</text><circle cx="360" cy="145" r="25" fill="#fff" stroke="#16202c" stroke-width="2"/><text x="360" y="151" font-size="15" font-weight="600" fill="#16202c" text-anchor="middle">R2</text><circle cx="530" cy="145" r="25" fill="#fff" stroke="#16202c" stroke-width="2"/><text x="530" y="151" font-size="15" font-weight="600" fill="#16202c" text-anchor="middle">R3</text><circle cx="340" cy="360" r="25" fill="#fff" stroke="#16202c" stroke-width="2"/><text x="340" y="366" font-size="15" font-weight="600" fill="#16202c" text-anchor="middle">R4</text><circle cx="500" cy="360" r="25" fill="#fff" stroke="#16202c" stroke-width="2"/><text x="500" y="366" font-size="15" font-weight="600" fill="#16202c" text-anchor="middle">R5</text><circle cx="660" cy="360" r="25" fill="#fff" stroke="#16202c" stroke-width="2"/><text x="660" y="366" font-size="15" font-weight="600" fill="#16202c" text-anchor="middle">R6</text><circle cx="810" cy="250" r="25" fill="#fff" stroke="#16202c" stroke-width="2"/><text x="810" y="256" font-size="15" font-weight="600" fill="#16202c" text-anchor="middle">R7</text><rect x="890" y="226" width="104" height="48" rx="10" fill="#16202c"/><text x="942" y="256" font-size="15" fill="#fff" text-anchor="middle">friend</text><line x1="546" y1="129" x2="574" y2="101" stroke="#c92a2a" stroke-width="3"/><line x1="574" y1="129" x2="546" y2="101" stroke="#c92a2a" stroke-width="3"/><text x="586" y="99" font-size="15" fill="#c92a2a" font-weight="600">packet 3 dropped &#8212; R3 was full</text><rect x="40" y="428" width="16" height="4" fill="#1a7f5a"/><text x="66" y="437" font-size="15" fill="#5d6b7a">packet 2 &#8212; arrives first</text><rect x="330" y="428" width="16" height="4" fill="#1f6feb"/><text x="356" y="437" font-size="15" fill="#5d6b7a">packet 1 &#8212; longer way round, arrives later</text></svg>