spring.application.name=p2p-share
server.port=${PORT:8080}

# --- room lifecycle -------------------------------------------------
# hard ceiling on concurrent rooms. ~300 bytes each, so 10k is a few MB.
peersend.rooms.max=10000
# an empty room is dropped once it has been untouched this long
peersend.rooms.ttl-minutes=30
# how often the sweeper runs, in ms
peersend.rooms.sweep-interval-ms=300000
