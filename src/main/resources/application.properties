spring.application.name=p2p-share
server.port=${PORT:8080}

# --- room lifecycle -------------------------------------------------
# hard ceiling on concurrent rooms. ~300 bytes each, so 10k is a few MB.
peersend.rooms.max=10000
# an empty room is dropped once it has been untouched this long
peersend.rooms.ttl-minutes=30
# how often the sweeper runs, in ms
peersend.rooms.sweep-interval-ms=300000

# --- stats ----------------------------------------------------------
# the only thing the server ever persists: an all-time count of rooms that
# reached two peers. one integer in a text file, nothing else in it. on railway
# this lands on the attached volume; locally it falls back to ./data (gitignored).
peersend.stats.file=${RAILWAY_VOLUME_MOUNT_PATH:./data}/connections.txt
