<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- icon = the wordmark's initials in Instrument Serif, outlined to paths in favicon.svg (favicons can't load web fonts).
         real files rather than a data: URI because Google ignores those and wants >=48px at a stable URL -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <meta name="theme-color" content="#030303"/>
    <title>PeerSend — Your file. Their browser. Nothing in between.</title>
    <meta name="description" content="Send files privately. No signup. No storage. Direct browser-to-browser transfer."/>

    <!-- social preview card: LinkedIn/WhatsApp/Slack/X build their link card from these.
         og.png is generated from client/og-card/og.html -->
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="PeerSend"/>
    <meta property="og:url" content="https://peersend.app/"/>
    <meta property="og:title" content="PeerSend — Your file. Their browser. Nothing in between."/>
    <meta property="og:description" content="No signup. No storage. Direct browser-to-browser transfer."/>
    <meta property="og:image" content="https://peersend.app/og.png"/>
    <meta property="og:image:width" content="1200"/>
    <meta property="og:image:height" content="630"/>
    <meta property="og:image:alt" content="PeerSend — Your file. Their browser. Nothing in between."/>
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="PeerSend — Your file. Their browser. Nothing in between."/>
    <meta name="twitter:description" content="No signup. No storage. Direct browser-to-browser transfer."/>
    <meta name="twitter:image" content="https://peersend.app/og.png"/>
    <link rel="canonical" href="https://peersend.app/"/>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "PeerSend",
      "url": "https://peersend.app/",
      "description": "Send files directly from your browser to theirs over an encrypted peer-to-peer connection. No signup, no server storage, no file size cap.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires a modern browser with WebRTC support",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": { "@type": "Person", "name": "Suyash Mandaokar", "url": "https://suyaxh.vercel.app/", "sameAs": ["https://suyaxh.vercel.app/"] }
    }
    </script>

</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
